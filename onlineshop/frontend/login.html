<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - T-STORE</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #f8f6fc;
        font-family: Arial, sans-serif;
        margin: 0;
    }
    .container {
        background: #ffffff;
        padding: 40px;
        border-radius: 8px;
        border: 1px solid #dddddd;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        width: 100%;
        max-width: 450px;
    }
    h2 {
        text-align: center;
        margin-bottom: 30px;
        color: #673ab7;
    }
    .input-group {
        margin-bottom: 20px;
        position: relative;
    }
    .input-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
        color: #555555;
    }
    .input-group input {
        width: 100%;
        padding: 12px 15px;
        border-radius: 4px;
        border: 1px solid #cccccc;
        box-sizing: border-box;
        font-size: 14px;
    }
    .input-group input:focus {
        outline: none;
        border-color: #673ab7;
    }
    .error-alert {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        padding: 12px;
        border-radius: 4px;
        margin-bottom: 20px;
        font-size: 14px;
        text-align: center;
        font-weight: bold;
        display: none;
    }
    button[type="submit"] {
        width: 100%;
        padding: 12px;
        border: 1px solid #d4af37;
        border-radius: 4px;
        background-color: #ffd700;
        color: #000000;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }
    button[type="submit"]:hover {
        background-color: #e0a800;
    }
    p {
        text-align: center;
        margin-top: 20px;
        color: #666666;
    }
    p a {
        color: #673ab7;
        text-decoration: none;
        font-weight: bold;
    }
    p a:hover {
        text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <form action="../backend/login_process.php" method="POST">
      <h2>Login to T-STORE</h2>
      
      <!-- Error Message Box -->
      <div id="login-error-msg" class="error-alert"></div>

      <div class="input-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" required autocomplete="username">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      
      <button type="submit">Login</button>
      <p>Don't have an account? <a href="register.php">Register here</a></p>
    </form>
  </div>

  <script>
    // Parse URL parameter if any
    const urlParams = new URLSearchParams(window.location.search);
    const errorParam = urlParams.get('error');
    const usernameParam = urlParams.get('username');

    if (errorParam) {
      const errorMsgBox = document.getElementById("login-error-msg");
      let displayMsg = "An error occurred. Please try again.";
      
      if (errorParam === 'incorrect_password') {
        displayMsg = "Incorrect password. Please try again.";
      } else if (errorParam === 'user_not_found') {
        displayMsg = "User account not found.";
      }
      
      errorMsgBox.textContent = "❌ " + displayMsg;
      errorMsgBox.style.display = "block";
    }

    if (usernameParam) {
      document.getElementById("username").value = usernameParam;
    }
  </script>
</body>
</html>
